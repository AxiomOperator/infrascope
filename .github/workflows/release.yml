name: Make release and binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --no-save --cwd ./internal/site

      - name: Build site
        run: bun run --cwd ./internal/site build

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"

      - name: Build .NET LHM executable for Windows sensors
        run: |
          dotnet build -c Release ./agent/lhm/beszel_lhm.csproj
        shell: bash

      - name: Prepare release signing key
        env:
          INFRASCOPE_RELEASE_SIGNING_KEY: ${{ secrets.INFRASCOPE_RELEASE_SIGNING_KEY }}
          INFRASCOPE_RELEASE_PUBLIC_KEY: ${{ vars.INFRASCOPE_RELEASE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$INFRASCOPE_RELEASE_SIGNING_KEY" ] || [ -z "$INFRASCOPE_RELEASE_PUBLIC_KEY" ]; then
            echo "::error::Set the INFRASCOPE_RELEASE_SIGNING_KEY secret and INFRASCOPE_RELEASE_PUBLIC_KEY variable (see docs/development.md)."
            exit 1
          fi
          umask 077
          printf '%s' "$INFRASCOPE_RELEASE_SIGNING_KEY" > /tmp/infrascope-release-signing.key
          # Fail fast if the private key doesn't match the public key embedded in the binaries.
          derived=$(go run ./internal/ghupdate/signtool -key-file /tmp/infrascope-release-signing.key -public)
          if [ "$derived" != "$INFRASCOPE_RELEASE_PUBLIC_KEY" ]; then
            echo "::error::INFRASCOPE_RELEASE_SIGNING_KEY does not match INFRASCOPE_RELEASE_PUBLIC_KEY."
            exit 1
          fi

      - name: GoReleaser beszel
        uses: goreleaser/goreleaser-action@v7
        with:
          workdir: ./
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN || secrets.GITHUB_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          IS_FORK: ${{ github.repository_owner != 'henrygd' }}
          # Embedded in the binaries so self-updates can verify signed archives.
          # The private key is read from the file written by the step above.
          INFRASCOPE_RELEASE_PUBLIC_KEY: ${{ vars.INFRASCOPE_RELEASE_PUBLIC_KEY }}

      - name: Remove release signing key
        if: always()
        run: rm -f /tmp/infrascope-release-signing.key
